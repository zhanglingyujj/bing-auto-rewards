name: Bing Daily Check-in

on:
  schedule:
    # 每天凌晨 2:05 执行（避开整点高峰，减少延迟）
    - cron: '5 2 * * *'
  workflow_dispatch: 
  push:
    branches: [ main ]

jobs:
  bing-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: 1
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium
        
    - name: Setup accounts configuration
      env:
        ACCOUNTS_CONFIG: ${{ secrets.ACCOUNTS_CONFIG }}
      run: |
        # 从GitHub Secrets读取账号配置
        echo "$ACCOUNTS_CONFIG" > accounts.json
        
    - name: Restore state
      uses: actions/cache@v4
      with:
        path: state_*.json
        key: bing-state-${{ github.run_id }}
        restore-keys: |
          bing-state-
        
    - name: Run Bing automation
      run: |
        python bingZDH.py --once
        
    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bing-logs
        path: |
          *.log
          *.png
        retention-days: 7
